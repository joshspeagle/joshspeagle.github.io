name: build-check

# Two gates:
#   1. staleness — rebuilding from content.json / tokens.json / @fontsource must
#      reproduce the committed HTML, CSS and sitemap byte for byte;
#   2. correctness — scripts/check_build.py asserts things a reproducible build can
#      still get wrong (listview data contract, empty content containers, undefined
#      CSS custom properties, raw hex outside the token system, broken internal
#      links/anchors, duplicate ids, unbalanced tags), and export_bib.py --check
#      asserts publications.bib still matches the publication cache.
# `npm run build` is the single source of build order — do not inline the steps here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      # A shallow checkout is enough: the build reads its dates out of the data
      # files (site.lastUpdated / the caches' own timestamps), never from git or
      # the clock, so a rebuild is byte-identical whenever it runs.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install self-hosted fonts (@fontsource)
        run: npm ci

      - name: Rebuild + check
        run: npm run build && npm run check

      # --untracked-files catches a NEW build output (e.g. feed.xml) that was
      # generated but never committed; `git diff` alone would not see it.
      - name: Fail if the committed build is stale
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "::error::Static build is out of date. Run 'npm run build' locally and commit the result."
            git --no-pager diff --stat
            git --no-pager status --porcelain
            exit 1
          fi
          echo "Build is up to date. ✓"
